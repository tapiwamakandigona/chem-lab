name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install, audit, lint and build
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          python -m py_compile tests/run_gates.py tests/gates/*.py tools/*.py
          python - <<'PY'
          from pathlib import Path

          offenders = []
          for path in Path("tests/gates").glob("*.py"):
              text = path.read_text()
              if "def snap(" not in text or "timeout=SHOT_TIMEOUT_MS" not in text:
                  offenders.append(path.name)
          if offenders:
              raise SystemExit(f"unbounded evidence screenshots: {offenders}")
          PY
          npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  probe-gates:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        shard: [core, interaction, assessment-a, mock-clock, assessment-b, library-a, library-b]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          playwright install-deps chromium
          playwright install chromium

      - name: Run ${{ matrix.shard }} probe shard
        env:
          CHEMLAB_DIST: ${{ github.workspace }}/dist
          CHEMLAB_SHOTS: ${{ github.workspace }}/test-results/${{ matrix.shard }}
          # Actions/navigation get a generous budget because SwiftShader on a
          # CI runner renders far slower than any student device. Evidence
          # screenshots keep a tight separate budget so a slow capture can
          # never advance a simulation by minutes (run 31589705427 root
          # cause), and gates seed the LOW graphics preset so click dispatch
          # stays fast (run 31609023837 root cause). Assertions unchanged.
          CHEMLAB_TIMEOUT_MS: '60000'
          CHEMLAB_SHOT_TIMEOUT_MS: '15000'
          CHEMLAB_QUALITY: 'low'
          # CI runners are ~2.5x slower than a dev sandbox. mock2 owns an
          # isolated shard and needs >1800 s on the slowest runner; all other
          # gates have internal progress/stall guards and finish far sooner.
          CHEMLAB_GATE_TIMEOUT_S: ${{ matrix.shard == 'mock-clock' && '2400' || '1800' }}
        run: python tests/run_gates.py --shard "${{ matrix.shard }}"

      - name: Upload gate screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-shots-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [build, probe-gates]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Deploy to Appwrite (chemlab.tapiwa.me)
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: python3 tools/deploy.py

      - name: Verify live
        run: |
          local_hash=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          test -n "$local_hash"
          for attempt in $(seq 1 12); do
            live_html=$(curl --fail --silent --show-error https://chemlab.tapiwa.me/) || true
            live_hash=$(printf '%s' "$live_html" | grep -o 'assets/index-[^"]*\.js' | head -1)
            echo "attempt=$attempt local=$local_hash live=$live_hash"
            if [ "$local_hash" = "$live_hash" ]; then
              printf '%s' "$live_html" | grep -q '14 interactive Cambridge'
              curl --fail --silent --show-error https://chemlab.tapiwa.me/robots.txt |
                grep -q 'Sitemap: https://chemlab.tapiwa.me/sitemap.xml'
              curl --fail --silent --show-error https://chemlab.tapiwa.me/sitemap.xml |
                grep -q '<loc>https://chemlab.tapiwa.me/</loc>'
              exit 0
            fi
            sleep 10
          done
          echo "live bundle did not converge to $local_hash" >&2
          exit 1
